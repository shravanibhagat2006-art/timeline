<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Timeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Our Story 💖</h1>

  <div class="timeline">

    <div class="timeline-item">
      <div class="dot"></div>
      <div class="content">
        <h2>First Meet</h2>
        <p>The day everything started ✨</p>
      </div>
    </div>

    <div class="timeline-item">
      <div class="dot"></div>
      <div class="content">
        <h2>First Talk</h2>
        <p>We talked for hours that night 💬</p>
      </div>
    </div>

    <div class="timeline-item">
      <div class="dot"></div>
      <div class="content">
        <h2>Best Memory</h2>
        <p>That unforgettable moment 🌸</p>
      </div>
    </div>

    <div class="timeline-item">
      <div class="dot"></div>
      <div class="content">
        <h2>Today</h2>
        <p>Still creating memories 💞</p>
      </div>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
