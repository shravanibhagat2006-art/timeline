<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Little Story 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="timestyle.css">
</head>
<body>

<!-- Surprise Intro -->
<div class="intro-screen" id="intro">
  <h1>Here’s a little surprise for you 💌</h1>
  <button onclick="enterSite()">Open It 💖</button>
</div>

<div class="container">

  <h1 class="main-title">Our Mini Photo Book 📖💞</h1>

  <!-- Timeline Item -->
  <div class="timeline-item" onclick="toggleItem(this)">
    <h2>First Meet 💕</h2>
    <div class="hidden-content">
      <div class="photo-card">
        <img src="firstmeet.JPG">
        <p>This was the moment everything started 🥹✨</p>
      </div>
    </div>
  </div>

  <div class="timeline-item" onclick="toggleItem(this)">
    <h2>First Talk 💌</h2>
    <div class="hidden-content">
      <div class="photo-card">
        <img src="firsttalk.JPG">
        <p>One conversation changed everything 💗</p>
      </div>
    </div>
  </div>

  <div class="timeline-item" onclick="toggleItem(this)">
    <h2>Best Memory 🌸</h2>
    <div class="hidden-content">
      <div class="photo-card">
        <img src="bestmemory.JPG">
        <p>This day will always be my favorite 🫶</p>
      </div>
    </div>
  </div>

  <div class="timeline-item" onclick="toggleItem(this)">
    <h2>Today ✨</h2>
    <div class="hidden-content">
      <div class="photo-card">
        <img src="today.JPG">
        <p>And we’re still writing our story… 💞</p>
      </div>
    </div>
  </div>

</div>

<script src="timescript.js"></script>
</body>
</html>
