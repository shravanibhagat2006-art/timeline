<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Timeline 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="timestyle.css">
</head>
<body>

<!-- Progress Bar -->
<div class="progress-bar"></div>

<!-- Intro Screen -->
<div class="intro-screen" id="intro">
  <h1>Welcome to Our Story 💕</h1>
  <button onclick="enterSite()">Click to Enter ✨</button>
</div>

<div class="container">

  <h1 class="main-title">Our Cute Timeline 💖</h1>

  <!-- Timeline Item 1 -->
  <div class="timeline-item" onclick="toggleItem(this)">
    <div class="dot"></div>
    <div class="content">
      <h2>First Meet 💕</h2>
      <div class="hidden-content">
        <img src="firstmeet.JPG">
        <p>This was the moment everything started 🥹✨</p>
      </div>
    </div>
  </div>

  <!-- Timeline Item 2 -->
  <div class="timeline-item" onclick="toggleItem(this)">
    <div class="dot"></div>
    <div class="content">
      <h2>First Talk 💌</h2>
      <div class="hidden-content">
        <img src="firsttalk.JPG">
        <p>Who knew one conversation could mean so much? 💗</p>
      </div>
    </div>
  </div>

  <!-- Timeline Item 3 -->
  <div class="timeline-item" onclick="toggleItem(this)">
    <div class="dot"></div>
    <div class="content">
      <h2>Best Memory 🌸</h2>
      <div class="hidden-content">
        <img src="bestmemory.JPG">
        <p>This day will always be my favorite 🫶</p>
      </div>
    </div>
  </div>

  <!-- Timeline Item 4 -->
  <div class="timeline-item" onclick="toggleItem(this)">
    <div class="dot"></div>
    <div class="content">
      <h2>Today ✨</h2>
      <div class="hidden-content">
        <img src="today.JPG">
        <p>And we’re still writing our story… 💞</p>
      </div>
    </div>
  </div>

</div>

<script src="timescript.js"></script>
</body>
</html>
